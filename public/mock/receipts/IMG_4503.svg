<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" width="400" height="620" role="img" aria-label="Uber trip receipt, total $51.40">
  <defs>
    <style>
      .p { fill: #fbfaf7; }
      .t { font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace; fill: #23211e; }
      .s { font-family: ui-sans-serif, "Segoe UI", system-ui, sans-serif; fill: #23211e; }
      .xs { font-size: 10px; }
      .sm { font-size: 12px; }
      .md { font-size: 14px; }
      .xl { font-size: 24px; letter-spacing: -0.5px; }
      .faint { fill: #8b8781; }
      .r { text-anchor: end; }
      .c { text-anchor: middle; }
      .b { font-weight: 700; }
      .rule { stroke: #d8d4cc; stroke-width: 1; }
    </style>
  </defs>

  <rect class="p" x="6" y="6" width="388" height="608" rx="2"/>
  <rect x="6" y="6" width="388" height="608" rx="2" fill="none" stroke="#e2ded4"/>

  <rect x="6" y="6" width="388" height="64" fill="#23211e"/>
  <text class="s xl b" x="28" y="48" fill="#fbfaf7">Uber</text>
  <text class="s xs" x="372" y="44" fill="#a9a49c" text-anchor="end">TRIP RECEIPT</text>

  <text class="s xs faint" x="28" y="96">Thanks for riding, Priya</text>
  <text class="s md b" x="28" y="122">Saturday, July 18, 2026</text>
  <text class="s xs faint" x="28" y="140">Trip ID 9f31-4503-bc80</text>

  <line class="rule" x1="28" y1="160" x2="372" y2="160"/>

