  <line x1="34" y1="436" x2="34" y2="456" stroke="#c6c2ba" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="30" y="456" width="8" height="8" fill="#23211e"/>
  <text class="t xs" x="50" y="464">20:59  4512 Fremont Ave N</text>

  <text class="t xs faint" x="28" y="492">14.2 mi · 21 min</text>

